services:
  app:
    build:
      context: ..
      dockerfile: .codevalid/Dockerfile
    ports:
      - "6713:6713"
    environment:
      PORT: "6713"
      NUXT_OAUTH_GITHUB_CLIENT_ID: "${NUXT_OAUTH_GITHUB_CLIENT_ID:-}"
      NUXT_OAUTH_GITHUB_CLIENT_SECRET: "${NUXT_OAUTH_GITHUB_CLIENT_SECRET:-}"
      NUXT_SESSION_PASSWORD: "${NUXT_SESSION_PASSWORD:-codevalid-test-session-password-32chars}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6713/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    depends_on:
      - toxiproxy
  toxiproxy:
    build:
      context: ./toxiproxy
    ports:
      - "8474:8474"
  seed-test:
    build:
      context: .
      dockerfile: seed-test.Dockerfile
      args:
        CACHEBUST: "${CODEVALID_CACHEBUST:-1}"
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["bash", "-lc"]
    command: ["echo seed-test image ready"]
